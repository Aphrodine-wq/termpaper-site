name: ci

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Render the pages
        run: cargo run --release --locked
      - run: npm run build
      - name: The committed pages, scripts and functions are what the source builds
        run: |
          git status --porcelain -- dist api
          test -z "$(git status --porcelain -- dist api)"
